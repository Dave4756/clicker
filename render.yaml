services:
  - type: web
    name: hair-miner-clicker
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/ranking
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: hair-miner-db
          property: connectionString
databases:
  - name: hair-miner-db
    plan: free
